name: API tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Run API tests
        run: npx mocha --reporter mochawesome

      - name: Save the test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: mochawesome-report/